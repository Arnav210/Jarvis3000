<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGradMo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfd6c5"/>
      <stop offset="100%" stop-color="#c9bfa9"/>
    </linearGradient>
    <linearGradient id="deskGradMo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6733a"/>
      <stop offset="50%" stop-color="#9a5a27"/>
      <stop offset="100%" stop-color="#733d13"/>
    </linearGradient>
    <linearGradient id="screenGradMo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowMo">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#wallGradMo)"/>
  <rect x="0" y="0" width="800" height="380" fill="#ded4be" opacity="0.9"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#a3967d" stroke-width="4"/>

  <!-- Left Monitor (Shifted & Tilted) -->
  <g transform="translate(240, 230)">
    <g transform="rotate(-8 70 50)" filter="url(#shadowMo)">
      <rect x="0" y="0" width="140" height="105" fill="#1e293b" rx="4"/>
      <rect x="5" y="5" width="130" height="95" fill="url(#screenGradMo)"/>
    </g>
    <rect x="62" y="105" width="16" height="50" fill="#334155"/>
    <ellipse cx="70" cy="155" rx="35" ry="8" fill="#475569"/>
    <!-- Detection Bounding Box -->
    <rect x="-10" y="-10" width="165" height="135" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" rx="4"/>
    <rect x="-10" y="-30" width="125" height="20" fill="#38bdf8" rx="3"/>
    <text x="52" y="-16" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">MONITOR MOVED</text>
  </g>

  <!-- Vertical Center Monitor -->
  <g transform="translate(420, 205)">
    <rect x="32" y="140" width="16" height="65" fill="#334155"/>
    <ellipse cx="40" cy="205" rx="30" ry="7" fill="#475569"/>
    <g transform="rotate(2 40 100)" filter="url(#shadowMo)">
      <rect x="0" y="0" width="80" height="155" fill="#0f172a" rx="4"/>
      <rect x="4" y="4" width="72" height="147" fill="#e0f2fe"/>
    </g>
  </g>

  <!-- Desk -->
  <polygon points="0,380 800,380 800,600 0,600" fill="url(#deskGradMo)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#5c2e0b" stroke-width="4"/>

  <!-- Divider -->
  <g transform="translate(580, 220)">
    <polygon points="0,380 60,10 160,10 120,380" fill="#1e293b" opacity="0.95"/>
  </g>

  <!-- Keyboard & Mouse on Desk -->
  <g transform="translate(250, 470) rotate(-2)" filter="url(#shadowMo)">
    <rect width="180" height="60" fill="#1e293b" rx="4"/>
    <rect x="5" y="5" width="170" height="50" fill="#0f172a" rx="2"/>
    <line x1="10" y1="15" x2="165" y2="15" stroke="#475569" stroke-width="2" stroke-dasharray="8 3"/>
    <line x1="10" y1="25" x2="165" y2="25" stroke="#475569" stroke-width="2" stroke-dasharray="8 3"/>
    <line x1="25" y1="45" x2="140" y2="45" stroke="#64748b" stroke-width="4"/>
  </g>

  <g transform="translate(475, 490)" filter="url(#shadowMo)">
    <ellipse cx="15" cy="20" rx="12" ry="18" fill="#1e293b"/>
    <ellipse cx="15" cy="20" rx="10" ry="16" fill="#0f172a"/>
    <line x1="15" y1="5" x2="15" y2="16" stroke="#475569" stroke-width="1.5"/>
  </g>
</svg>