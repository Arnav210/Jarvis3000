<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfd6c5"/>
      <stop offset="100%" stop-color="#c9bfa9"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6733a"/>
      <stop offset="50%" stop-color="#9a5a27"/>
      <stop offset="100%" stop-color="#733d13"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="activeScreenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Classroom Wall -->
  <rect width="800" height="600" fill="url(#wallGrad)"/>
  
  <!-- Wall Partition / Cork Board Trim -->
  <rect x="0" y="0" width="800" height="380" fill="#ded4be" opacity="0.9"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#a3967d" stroke-width="4"/>

  <!-- Classroom Posters on the wall -->
  <!-- Poster 1: At Del Norte We Protect The Nest -->
  <g transform="translate(430, 60)" filter="url(#shadow)">
    <rect width="90" height="130" fill="#0284c7" rx="3"/>
    <rect x="4" y="4" width="82" height="122" fill="#e0f2fe"/>
    <text x="45" y="25" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#0369a1" text-anchor="middle">DEL NORTE</text>
    <text x="45" y="38" font-family="Inter, sans-serif" font-size="6" font-weight="bold" fill="#0284c7" text-anchor="middle">PROTECT THE NEST</text>
    <!-- Hawk Logo Outline -->
    <circle cx="45" cy="70" r="22" fill="#0284c7" opacity="0.2"/>
    <path d="M 35,65 Q 45,52 55,65 Q 52,78 45,72 Q 38,78 35,65 Z" fill="#0369a1"/>
    <text x="45" y="112" font-family="Inter, sans-serif" font-size="6" fill="#64748b" text-anchor="middle">SOAR HIGH</text>
  </g>

  <!-- Poster 2: Hate & Respect Rules -->
  <g transform="translate(530, 50)" filter="url(#shadow)">
    <rect width="95" height="120" fill="#14532d" rx="3"/>
    <rect x="4" y="4" width="87" height="112" fill="#1e293b"/>
    <rect x="8" y="10" width="22" height="98" fill="#15803d" rx="2"/>
    <rect x="34" y="10" width="24" height="98" fill="#0369a1" rx="2"/>
    <rect x="62" y="10" width="24" height="98" fill="#047857" rx="2"/>
    <text x="19" y="30" font-family="Inter, sans-serif" font-size="5" font-weight="bold" fill="#fff" text-anchor="middle">INTERRUPT</text>
    <text x="46" y="30" font-family="Inter, sans-serif" font-size="5" font-weight="bold" fill="#fff" text-anchor="middle">QUESTION</text>
    <text x="74" y="30" font-family="Inter, sans-serif" font-size="5" font-weight="bold" fill="#fff" text-anchor="middle">EDUCATE</text>
    <text x="46" y="90" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#ef4444" text-anchor="middle">NO HATE</text>
  </g>

  <!-- Poster 3: Scrum Process Banner -->
  <g transform="translate(420, 210)" filter="url(#shadow)">
    <rect width="130" height="95" fill="#f8fafc" rx="2"/>
    <rect x="6" y="8" width="118" height="16" fill="#3b82f6" rx="2"/>
    <text x="65" y="20" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle">SCRUM PROCESS</text>
    <!-- Process Flow Circles -->
    <circle cx="25" cy="55" r="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="25" y="58" font-family="Inter, sans-serif" font-size="6" fill="#0369a1" text-anchor="middle">Plan</text>
    <line x1="38" y1="55" x2="52" y2="55" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="65" cy="55" r="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="65" y="58" font-family="Inter, sans-serif" font-size="6" fill="#b45309" text-anchor="middle">Sprint</text>
    <line x1="78" y1="55" x2="92" y2="55" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="105" cy="55" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="105" y="58" font-family="Inter, sans-serif" font-size="6" fill="#15803d" text-anchor="middle">Review</text>
  </g>

  <!-- Poster 4: Sticky notes / charts -->
  <g transform="translate(230, 70)">
    <rect width="55" height="55" fill="#fef08a" transform="rotate(-3)" filter="url(#shadow)"/>
    <rect x="70" y="5" width="50" height="50" fill="#fed7aa" transform="rotate(4)" filter="url(#shadow)"/>
    <rect x="135" y="0" width="50" height="60" fill="#e0e7ff" transform="rotate(-2)" filter="url(#shadow)"/>
  </g>

  <!-- Wall Outlet / Box -->
  <rect x="400" y="195" width="25" height="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="2"/>

  <!-- Workstation Table (Wood Grain) -->
  <polygon points="0,380 800,380 800,600 0,600" fill="url(#deskGrad)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#5c2e0b" stroke-width="4"/>

  <!-- Left Background Workstation (Station 3) -->
  <g transform="translate(140, 260)" opacity="0.85">
    <rect x="0" y="0" width="70" height="65" fill="#1e293b" rx="2"/>
    <rect x="3" y="3" width="64" height="59" fill="#0f172a"/>
    <rect x="30" y="65" width="10" height="30" fill="#334155"/>
    <rect x="18" y="95" width="34" height="6" fill="#475569" rx="2"/>
  </g>

  <!-- Main Workstation 4 (Station in Focus) -->
  <!-- Horizontal Left Monitor (Dell 24") -->
  <g transform="translate(260, 240)">
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="140" height="105" fill="#1e293b" rx="4" filter="url(#shadow)"/>
    <!-- Screen Surface -->
    <rect x="5" y="5" width="130" height="95" fill="url(#screenGrad)"/>
    <!-- Monitor Stand -->
    <rect x="62" y="105" width="16" height="50" fill="#334155"/>
    <ellipse cx="70" cy="155" rx="35" ry="8" fill="#475569"/>
  </g>

  <!-- Vertical Center Monitor (Dell Portrait Mode) -->
  <g transform="translate(420, 205)">
    <!-- Stand -->
    <rect x="32" y="140" width="16" height="65" fill="#334155"/>
    <ellipse cx="40" cy="205" rx="30" ry="7" fill="#475569"/>
    <!-- Vertical Bezel (Turned/Tilted) -->
    <g transform="rotate(2 40 100)" filter="url(#shadow)">
      <rect x="0" y="0" width="80" height="155" fill="#0f172a" rx="4"/>
      <rect x="4" y="4" width="72" height="147" fill="url(#activeScreenGrad)"/>
      <!-- Code lines on portrait screen -->
      <line x1="10" y1="20" x2="65" y2="20" stroke="#0284c7" stroke-width="3"/>
      <line x1="10" y1="30" x2="50" y2="30" stroke="#64748b" stroke-width="2"/>
      <line x1="10" y1="40" x2="60" y2="40" stroke="#0369a1" stroke-width="2"/>
      <line x1="10" y1="50" x2="40" y2="50" stroke="#64748b" stroke-width="2"/>
      <line x1="15" y1="60" x2="70" y2="60" stroke="#0284c7" stroke-width="2"/>
      <line x1="15" y1="70" x2="55" y2="70" stroke="#0369a1" stroke-width="2"/>
      <line x1="10" y1="85" x2="68" y2="85" stroke="#64748b" stroke-width="2"/>
      <line x1="10" y1="95" x2="45" y2="95" stroke="#0284c7" stroke-width="2"/>
      <line x1="10" y1="105" x2="60" y2="105" stroke="#64748b" stroke-width="2"/>
    </g>
  </g>

  <!-- Right Divider / Partition Acoustic Board -->
  <g transform="translate(580, 220)">
    <polygon points="0,380 60,10 160,10 120,380" fill="#1e293b" opacity="0.95" filter="url(#shadow)"/>
    <line x1="0" y1="380" x2="60" y2="10" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Cables & Hardware on Desk -->
  <path d="M 430,410 Q 400,430 380,470" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.7"/>
  <path d="M 450,410 Q 480,440 500,490" fill="none" stroke="#1e293b" stroke-width="3" opacity="0.7"/>

  <!-- Keyboard on Desk -->
  <g transform="translate(250, 470) rotate(-2)" filter="url(#shadow)">
    <rect width="180" height="60" fill="#1e293b" rx="4"/>
    <rect x="5" y="5" width="170" height="50" fill="#0f172a" rx="2"/>
    <!-- Key rows -->
    <line x1="10" y1="15" x2="165" y2="15" stroke="#475569" stroke-width="2" stroke-dasharray="8 3"/>
    <line x1="10" y1="25" x2="165" y2="25" stroke="#475569" stroke-width="2" stroke-dasharray="8 3"/>
    <line x1="10" y1="35" x2="165" y2="35" stroke="#475569" stroke-width="2" stroke-dasharray="8 3"/>
    <line x1="25" y1="45" x2="140" y2="45" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- Missing Mouse Area (Indicator / Bounding Box) -->
  <g transform="translate(460, 480)">
    <!-- Empty mouse pad / cord -->
    <path d="M 470,430 Q 480,460 480,490" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="0" y="0" width="55" height="55" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3" rx="4"/>
    <rect x="0" y="-16" width="70" height="16" fill="#ef4444" rx="2"/>
    <text x="35" y="-4" font-family="Inter, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">MISSING</text>
  </g>
</svg>